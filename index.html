<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedition Registration Form | Gold & Purple Edition</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./Form Testing Exercise_ Find Validation Bugs _ Realbugz QA Practice_files/main.css">
</head>
<body>
    <header>
        <div class="header-container">
            <img src="./Form Testing Exercise_ Find Validation Bugs _ Realbugz QA Practice_files/logo.svg" alt="Realbugz Logo" class="logo">
        </div>
    </header>

    <main>
        <div class="form-card">
            <h1>Register for the Expedition in search of Eldoria</h1>
            <p class="subtitle">Please fill in the details below to submit your application for the historic journey.</p>
            
            <form id="expeditionForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="fullName">Full Name*</label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g., Peter Ford" required maxlength="100">
                </div>

                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" id="email" name="email" placeholder="e.g., test@email.com" required>
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number*</label>
                    <input type="tel" id="contactNumber" name="contactNumber" pattern="^\+?[0-9](?:-?[0-9]){6,14}$" placeholder="e.g., +1234567890" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth*</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="experience">Archaeology Experience</label>
                    <select id="experience" name="experience">
                        <option>No experience</option>
                        <option>Amateur (up to 1 year)</option>
                        <option>Intermediate (1–5 years)</option>
                        <option>Professional (more than 5 years)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="group-title">Preferred Role in the Expedition</label>
                    <div class="options-container">
                        <div class="checkbox-option">
                            <input type="checkbox" id="researcher" name="role" value="Researcher">
                            <label for="researcher">Researcher</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="photographer" name="role" value="Photographer">
                            <label for="photographer">Photographer</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="drone" name="role" value="Drone Operator">
                            <label for="drone">Drone Operator</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="cartographer" name="role" value="Cartographer">
                            <label for="cartographer">Cartographer</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="medic" name="role" value="Medic">
                            <label for="medic">Medic</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="logistician" name="role" value="Logistician">
                            <label for="logistician">Logistician</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="group-title">Preferred Expedition Region*</label>
                    <div class="options-container">
                        <div class="radio-option">
                            <input type="radio" name="region" id="southAmerica" value="South America" required>
                            <label for="southAmerica">South America</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="region" id="africa" value="Africa">
                            <label for="africa">Africa</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="region" id="asia" value="Asia">
                            <label for="asia">Asia</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="region" id="europe" value="Europe">
                            <label for="europe">Europe</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="region" id="australia" value="Australia">
                            <label for="australia">Australia</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="range">Select your desired salary per week ($): <span id="rangeValue">700</span></label>
                    <input type="range" id="range" name="range" min="0" max="1700" value="700">
                </div>

                <div class="form-group">
                    <label for="contactMethod">Preferred Contact Method</label>
                    <select id="contactMethod" name="contactMethod">
                        <option>Email</option>
                        <option>Phone</option>
                        <option>WhatsApp</option>
                        <option>Telegram</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="passport">Upload Passport/ID* (JPG, PNG, PDF)</label>
                    <input type="file" id="passport" name="passport" accept=".jpg, .jpeg, .png, .pdf" required>
                </div>

                <div class="form-group">
                    <label for="comments">Additional Comments</label>
                    <textarea id="comments" name="comments" rows="4" maxlength="500"></textarea>
                </div>

                <div class="form-group terms-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I Agree to the Terms and Conditions*</label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">Submit Registration</button>
                    <button type="reset" class="btn-reset">Clear Form</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2026 Eldoria Expedition. All rights reserved. Premium QA Practice Website.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="./Form Testing Exercise_ Find Validation Bugs _ Realbugz QA Practice_files/main.js.download"></script>
</body>
</html>
